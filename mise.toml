# Dev tasks for tachy (https://mise.jdx.dev/).
#
# release — publish a GitHub release with gh: tags the committed source
# as v<version> (version = the build date in source/assets/version, the
# same source `tachy version` prints) and lets GitHub generate the
# notes. Run it from a clean tree, after committing the version bump:
#
#     mise run release

[tasks.release]
description = "Tag v<version> (from source/assets/version) and create the GitHub release with gh"
run = '''
set -eu
die() { echo "release: $*" >&2; exit 1; }
command -v gh >/dev/null 2>&1 || die "gh (GitHub CLI) is not installed"
git diff --quiet && git diff --cached --quiet || die "working tree is dirty — commit first"
version=$(tr -d ' \t\r\n' < source/assets/version)
[ -n "$version" ] || die "source/assets/version is empty"
tag="v$version"
git rev-parse -q --verify "refs/tags/$tag" >/dev/null && die "$tag already exists"
echo "release: tagging $(git rev-parse --short HEAD) as $tag"
git tag "$tag"
git push origin "refs/tags/$tag"
gh release create "$tag" --verify-tag --title "tachy $version" --generate-notes
'''
