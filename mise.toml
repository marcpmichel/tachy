# Dev tasks for tachy (https://mise.jdx.dev/).
#
# release — publish a GitHub release with gh: tags the committed source
# as v<version> (version = the build date in source/assets/version, the
# same source `tachy version` prints), builds the release binary and
# uploads it as tachy-<version>-linux-amd64, and lets GitHub generate
# the notes. Run it from a clean tree, after committing the version
# bump:
#
#     mise run release
#
# syntax — install the Pravic editor syntax for the current user:
# copies syntax/pravic.vim into ~/.vim/syntax and
# $XDG_CONFIG_HOME/nvim/syntax (default ~/.config/nvim/syntax) and
# adds the *.pravic filetype detection (ftdetect/pravic.vim):
#
#     mise run syntax

[tasks.release]
description = "Tag v<version> (from source/assets/version), build the release binary and create the GitHub release with gh, uploading tachy-<version>-linux-amd64"
run = '''
set -eu
die() { echo "release: $*" >&2; exit 1; }
command -v gh >/dev/null 2>&1 || die "gh (GitHub CLI) is not installed"
git diff --quiet && git diff --cached --quiet || die "working tree is dirty — commit first"
version=$(tr -d ' \t\r\n' < source/assets/version)
[ -n "$version" ] || die "source/assets/version is empty"
tag="v$version"
git rev-parse -q --verify "refs/tags/$tag" >/dev/null && die "$tag already exists"
asset="tachy-$version-linux-amd64"
echo "release: building $asset from $(git rev-parse --short HEAD)"
dub build --build=release || die "release build failed"
cp tachy "$asset"
trap 'rm -f "$asset"' EXIT
echo "release: tagging $(git rev-parse --short HEAD) as $tag"
git tag "$tag"
git push origin "refs/tags/$tag"
gh release create "$tag" --verify-tag --title "tachy $version" --generate-notes "$asset"
'''

[tasks.syntax]
description = "Install syntax/pravic.vim and *.pravic filetype detection into the current user's Vim and Neovim"
run = '''
set -eu
die() { echo "syntax: $*" >&2; exit 1; }
[ -f syntax/pravic.vim ] || die "syntax/pravic.vim not found — run from the tachy repo"
cfg="${XDG_CONFIG_HOME:-$HOME/.config}"
for dir in "$HOME/.vim" "$cfg/nvim"; do
  mkdir -p "$dir/syntax" "$dir/ftdetect"
  cp syntax/pravic.vim "$dir/syntax/pravic.vim"
  echo 'autocmd BufNewFile,BufRead *.pravic setfiletype pravic' > "$dir/ftdetect/pravic.vim"
  echo "syntax: installed pravic syntax + filetype detection in $dir"
done
'''

